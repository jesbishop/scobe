<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scobe — The full-stack creative canvas</title>
    <meta
      name="description"
      content="Scobe is an infinite canvas of live browsers and editable frames. Snapshot any site into layers, and let your coding agent build on the canvas over MCP."
    />
    <meta property="og:title" content="Scobe — The full-stack creative canvas" />
    <meta
      property="og:description"
      content="An infinite canvas of live browsers and editable frames, driven by your coding agent."
    />
    <meta property="og:image" content="/icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="nav">
      <a class="wordmark" href="/" aria-label="Scobe home">
        <img src="/scobe-logo.png" alt="" />
      </a>
      <div class="nav-actions">
        <a class="nav-download js-download" id="download" href="https://github.com/jesbishop/scobe/releases/latest/download/Scobe-Setup.exe">
          Download
        </a>
        <button class="nav-menu" type="button" aria-label="Menu">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2 4.25h12M2 8h12M2 11.75h12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>The full-<br />stack<br />creative<br />canvas</h1>

        <div class="hero-stage" aria-hidden="true">
          <div class="hero-back"></div>
          <div class="hero-card">
            <div class="hero-card-top"></div>
            <div class="hero-card-lines">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="hero-edge"></div>
        </div>

        <a class="hero-download js-download" href="https://github.com/jesbishop/scobe/releases/latest/download/Scobe-Setup.exe">
          Download
        </a>
      </section>
    </main>

    <script>
      const downloads = {
        win: 'https://github.com/jesbishop/scobe/releases/latest/download/Scobe-Setup.exe',
        mac: 'https://github.com/jesbishop/scobe/releases/latest/download/Vanta-mac-arm64.dmg',
        linux: 'https://github.com/jesbishop/scobe/releases/latest/download/Vanta-linux-x86_64.AppImage'
      }
      const ua = navigator.userAgent
      const os = /Windows/i.test(ua) ? 'win' : /Mac/i.test(ua) ? 'mac' : /Linux/i.test(ua) ? 'linux' : 'win'
      for (const el of document.querySelectorAll('.js-download')) el.href = downloads[os]
    </script>
  </body>
</html>
